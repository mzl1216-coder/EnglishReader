name: Build Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
      - name: Create isolated build environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
      - name: Tests
        run: .\.venv\Scripts\python.exe -m pytest -q --junitxml=test-results/unit.xml
      - name: Installer and portable build
        run: .\.venv\Scripts\python.exe tools/build.py
      - name: Test bundled runtime without Python on PATH
        shell: pwsh
        run: |
          $env:ENGLISHREADER_DATA_DIR = "$env:RUNNER_TEMP\reader-smoke"
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          $process = Start-Process -FilePath .\dist\EnglishReader\EnglishReader.exe -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Bundled application timed out' }
          if ($process.ExitCode -ne 0) { throw "Bundled application failed: $($process.ExitCode)" }
          $report = Get-Content "$env:ENGLISHREADER_DATA_DIR\EnglishReader\smoke-test.json" | ConvertFrom-Json
          if (-not $report.visible -or -not $report.frozen) { throw 'Bundled runtime validation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: EnglishReader-Windows-x64
          path: |
            dist/EnglishReader-Setup-x64.exe
            dist/EnglishReader-Portable-x64.zip
            test-results/unit.xml
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME dist/EnglishReader-Setup-x64.exe dist/EnglishReader-Portable-x64.zip --verify-tag --title "English Reader $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
