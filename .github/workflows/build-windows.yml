name: Build Windows
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
      - name: Create isolated build environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
      - name: Tests
        run: .\.venv\Scripts\python.exe -m pytest -q --junitxml=test-results/unit.xml
      - name: Installer and portable build
        run: .\.venv\Scripts\python.exe tools/build.py
      - name: Test installer and portable without Python on PATH
        shell: pwsh
        run: .\tools\test_packages.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: EnglishReader-Windows-x64
          path: |
            dist/EnglishReader-Setup-x64.exe
            dist/EnglishReader-Portable-x64.zip
            test-results/unit.xml
            test-results/packages/report.json
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME dist/EnglishReader-Setup-x64.exe dist/EnglishReader-Portable-x64.zip --verify-tag --title "English Reader $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
